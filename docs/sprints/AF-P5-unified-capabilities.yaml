# v3 增量：信任 · 异步 · 失败恢复 · 审批减负（见 AF-P5-DECISIONS.md 2026-05-27）
# 前置：AF-01~11 已落地
# updated: 2026-05-27

plan_id: AF-P5
version: "3.0"
supersedes: "2.0"
decisions_log: docs/sprints/AF-P5-DECISIONS.md

# ═══════════════════════════════════════════════════════════════════════════
# 一、产品原则（比功能列表更重要）
# ═══════════════════════════════════════════════════════════════════════════

product_principles:
  - id: P1_intent_not_workflow
    rule: 用户说「想做什么」，不说 workflow 名
    implication: 工厂主界面 = 一个输入框 + 智能推荐；workflow 是系统内部路由

  - id: P2_context_first
    rule: 系统先看上下文，再提问
    signals:
      empty_workspace: 推荐「新建项目」向导，不展示 6 张产线卡片
      has_git_and_tests: 默认「加功能」；粘贴 stack trace → 默认「修 bug」
      active_run: 输入框变为「追加指令 / 审批」，不重复开 Run

  - id: P3_one_primary_path
    rule: 首屏最多 3 个明确选项 + 1 个「更多」
    guided_mode: [新建项目, 改现有代码, 试用 30 秒演示]
    studio_mode: 同上 + 高级产线折叠

  - id: P4_progress_visible
    rule: 用户永远知道「谁在干什么、卡在哪、下一步点哪」
    implication: 产线看板 + 角色名 + 单一主 CTA（批准 / 继续 / 重试）

  - id: P5_no_dead_ends
    rule: Run 结束、讨论结束、审批结束 — 必有「下一步」按钮
    implication: 串联 CTA 是 P0，不是 P2 锦上添花

  - id: P6_slack_not_config
    rule: 团队 = @ 人，不是配 YAML
    implication: 角色触发词进「高级设置」；默认 @ 选择器 + 场景预设

  - id: P7_factory_home_team_optional
    rule: 80% 用户 80% 时间在工厂；团队是「需要商量时」才进去
    implication: 团队对话能力可嵌入工厂 Context Panel，不必先导航到 /teams

  - id: P8_trust_before_launch
    rule: 点「启动」前 5 秒内用户看见：预计时长、阶段数、可能影响的路径、预估成本
    implication: LaunchPreviewBar；比加 workflow 更能提高 run_completion

  - id: P9_approval_not_fatigue
    rule: 信任质量门后，默认「只在最终交付批一次」
    implication: 设置项 approval_policy；首次用户可强制全批建立心智

  - id: P10_failure_recoverable
    rule: 失败必须比成功路径设计得更细：阶段重试、终端、跳过门（高级）
    implication: 门控失败 / CLI 未配 / Run failed 各有固定 CTA，禁止只给日志

  - id: P11_async_owner
    rule: 用户不必盯着 Run；待批准必须 push 到 App 外（通知/badge/待办条）
    implication: Alpha-UX-2 必须含 AF-UX-08，不能只做 Context Panel

product_stage:
  current: pre_launch
  users: 0
  next_milestone: GATE-2  # 10 人朋友测，见 docs/sprints/GATE-2-friend-test.yaml
  not_yet:
    - w2_retention 优化
    - 异步通知 / Dock badge（AF-UX-08）
    - 个性化「第 3 次 Run」（AF-UX-12）
    - 团队 @ / 讨论（AF-UX-04/06）— 除非创始人自己要用

pre_launch_priority:
