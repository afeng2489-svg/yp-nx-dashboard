    - AF-UX-02   # 一个输入框，能演示
    - AF-12      # 看板让人看见「团队在干活」
    - AF-04      # Golden Path 已有 — 保持可跑
    - AF-UX-03   # Run 结束有下一步（演示连贯）
  ship_if_time:
    - AF-UX-01   # 首启向导 — 朋友测时再加也来得及
    - AF-16      # greenfield — 第二条演示路径
    - AF-UX-09   # 失败重试 — 创始人 dogfood 时会碰到
  defer_until_gate2:
    - AF-UX-07   # 启动预览 — 有 10 人后再看「敢不敢点」
    - AF-UX-08
    - AF-UX-04a
    - AF-UX-05
    - AF-13
  defer_until_beta:
    - AF-UX-04b
    - AF-UX-06
    - AF-UX-10
    - AF-UX-11
    - AF-UX-12
    - AF-14
    - AF-15
  defer_until_gate2_or_friend_blocker:
    - AF-MM-01   # 双引擎设置 — 朋友无 Claude CLI 则提前
    - AF-MM-02   # API 车道与 model 路由

pre_launch_metrics:
  - founder_golden_success: 创始人连续 3 次 Golden Path 成功
  - demo_recordable: 5min 内录屏从打开 App → 看到 diff → 点批准
  - friend_test_ready: GATE-2 脚本 + 安装包可发
  - friend_test_3_of_10: 10 人中至少 3 人 24h 内完成 1 次 Run
  - friend_cli_coverage: 10 人中至少几人已装 Claude CLI（决定 AF-MM 是否提前）

# ═══════════════════════════════════════════════════════════════════════════
# 十、双引擎 — Claude Code + 多模型 API（AF-MM）
# ═══════════════════════════════════════════════════════════════════════════
# MASTER-PLAN 原「多模型 UI Phase1 不做」指模型超市；本段为「双车道产品化」，范围见 explicit_not_doing

dual_engine_model:
  positioning: |
    不是「模型超市」，是「双引擎工厂」：
    · 代码车道（Code Lane）— Claude Code CLI：读写仓库、Bash、质量门 — 默认且 Golden Path 必须
    · 文本车道（Text Lane）— HTTP API：摘要、规划草稿、讨论、审查报告 — 可多 provider
    用户心智：「改代码用 Claude；省钱的文字活走 API」— 不是选一个模型包打天下

  current_state:
    backend_done:
      - AF-04b executor 双车道（claude_cli | api | auto）
      - solo-dev「交付摘要」已 executor: api
      - nexus_ai：OpenAI / DeepSeek / Qwen / Ollama / Zhipu 等
      - AISettingsPage：ProviderGrid + 路由规则 + Claude CLI 路径
    gap:
      - 工厂 quick-run / 团队对话 / 群聊 仍 hard-require Claude CLI
      - 用户感知「只支持 Claude Code」— 设置页与主路径脱节
      - 无 CLI 时直接 error，无 Text Lane 降级
      - yaml model 字段未统一路由到 AIModelManager

  gate2_risk: |
    10 个朋友里若多人无 Claude Code 订阅，GATE-2 会卡死。
    AF-MM-01 最低交付：配好 API Key 后，至少「交付摘要 / 计划 / 审查」类 Run 可完成；
    全栈改代码仍要求 Claude CLI（诚实告知，不假装 API 能改 repo）。

execution_order_mm:
  - AF-MM-01   # 双引擎设置 + 工厂可见（GATE-2 前若朋友无 CLI 则提前）
  - AF-MM-02   # Workflow/Role model → provider 路由打通
  - AF-MM-03   # 无 CLI 优雅降级（Text-only 模式）— GATE-2 后

epics_mm:
  - id: AF-MM-01
    title: 双引擎设置产品化
    user_story: 我在设置里配 OpenAI/DeepSeek/Ollama，工厂里能看见「代码走 Claude、摘要走 API」
    estimated_hours: 24
    phase: gate2_prep  # pre_launch 末或 GATE-2 并行
    deliverables:
      - 设置 ▸ AI：分区「代码引擎（Claude CLI）」「文本引擎（API Provider）」
      - 默认文本 provider + 默认模型；API Key 检测状态 Chip
      - 工厂 LaunchPreviewBar（AF-UX-07 可合并）显示：代码车道 Claude · 文本车道 DeepSeek 等
      - 未配 CLI → 明确 Banner「可跑文本类任务；改代码需配置 Claude CLI」
    success_metric: api_provider_configured 可演示；friend_without_cli 能完成「仅 API stage」的 Run
    explicit_not:
      - 首屏模型选择器
      - 每个 stage 手动选 provider

  - id: AF-MM-02
    title: model 字段 → Provider 路由
    user_story: workflow/角色上的 model 真正走到对应 API，不只 Claude CLI --model
    estimated_hours: 32
    depends_on: [AF-MM-01]
    deliverables:
      - yaml agent.model + executor:api → AIModelManager.complete(provider)
      - RoleEditor model 下拉：Claude 系列 + 已配置 API 模型
      - execution detail 展示 executor + provider + cost（延续 AF-04b 埋点）
      - 扩展 Text Lane stages：writing-plans 全文、review-cycle 报告（executor:api）
    gate: cargo test executor_routing; solo-dev 摘要 stage provider 可配置

  - id: AF-MM-03
    title: 无 CLI 优雅降级（Text-only 工厂）
    user_story: 没有 Claude Code 的朋友仍能体验「计划 → 摘要 → 审查报告」闭环
    estimated_hours: 40
    depends_on: [AF-MM-02, AF-UX-03]
    phase: post_gate2
    deliverables:
      - factoryRun 检测 cliReady → 路由到 text-only workflow 变体 or 跳过 code stages
      - text-only 产线 UI（3 段：计划/审查/摘要）— 不对用户说 workflow 名
      - 诚实 CTA：「要自动改代码，请配置 Claude CLI 或 Cursor + 手动合入」
    explicit_not:
      - API 模拟 Claude Code 工具链（Edit/Bash）— 不做假全能
      - OpenAI function calling 完整替代 CLI（Phase 3+ 再评估）

  - id: AF-MM-04
    title: 成本路由（可选 Beta）
    user_story: 同一任务自动选「够用的便宜模型」
    estimated_hours: 24
    phase: beta
    depends_on: [AF-MM-02]
    deliverables:
      - 文本车道：摘要→Haiku/mini，规划→Sonnet 级 — 规则表非 LLM
      - 设置：「成本优先 / 质量优先」
    note: 0 用户阶段不做

dual_engine_principles:
  - id: MM1_code_lane_default
    rule: 改代码、质量门、Golden Path 默认 Claude CLI，不妥协
  - id: MM2_text_lane_multi
    rule: 无工具纯文本 stage 必须可走 API 多 provider
  - id: MM3_honest_capability
    rule: UI 必须标明「API 不能自动改仓库」，禁止误导
  - id: MM4_settings_not_factory
    rule: 工厂首屏不变成选模型；引擎在设置里配，工厂只显示当前双车道状态

wedge_promise: |
  唯一对外承诺：15 分钟内，要么可跑的新项目骨架，要么可 merge 的 diff；
  否则明确卡在哪、提供一键从失败阶段重试。
  四人组、讨论、资产库 — 承诺成立后的加分项，不进楔子。

north_star: |
  打开 App → 30 秒理解「输入想法，AI 团队帮你做出来」→
  24h 内完成第一次 Run（建厂 or 改代码 or 修 bug）→
  15min 内看到可运行结果 or diff → 点一次批准 → 完成
  （楔子见 wedge_promise）

positioning: |
  本地 AI 开发部。Cursor 写代码，TeamFlow 跑团队。
  引导模式（3 选 1）+ 工作室模式（全控）并存；UI 默认精炼。

# ═══════════════════════════════════════════════════════════════════════════
# 二、信息架构（用户看到的 vs 工程师内部的）
# ═══════════════════════════════════════════════════════════════════════════

user_facing_ia:
  factory_home:
    hero: 一句话输入（占屏 40%）
    sub: 根据上下文推荐的 1 条产线预览（RunPipelineBoard 待命态）
    actions: [启动, 试用演示]
    secondary: 更多方式 ▸（修 bug / 大功能 / 写计划 / 审查 — 折叠）
  context_panel:
    during_run: [产线进度, 任务时间线, 待审批, 产物预览, 终端]
    after_run: [交付摘要, 下一步 CTA, 在 Cursor 中打开]
  launch_preview_bar:
    below_input: [预计时长, 阶段数, 可能影响路径, 预估 CLI 成本, 高级 override]
  factory_todo_strip:
    when_away: [待批准 N 项, 失败 Run 可重试 — 比 Approvals Tab 更显眼]
  teams:
    entry: 工厂内「和团队商量」链接 / Context 内嵌轻量 @ 面板
    detail: 成员 | 团队聊天（合并后）| Pipeline | 设置
    removed_from_default: 独立的「对话 vs 讨论」双 Tab 心智负担

internal_workflow_tiers:
  tier_1: [greenfield-mvp, solo-dev, quick-fix, dev-workflow]
  tier_2: [writing-plans, review-cycle, investigate]
  tier_3: [ui-ux-design, page-generate, brainstorm, issue-*]
  note: Tier 不对用户暴露；仅影响路由与运营优先级

# ═══════════════════════════════════════════════════════════════════════════
# 三、核心用户旅程（按频率排序）
# ═══════════════════════════════════════════════════════════════════════════

journeys:
  - id: J1_first_open
    frequency: 100% 新用户
    goal: 24h 内第一次 Run
    ux_flow: |
      首次打开 → 仅 2 选 1：
        A) 「我有个想法，从零开始」→ 新建项目向导（AF-UX-01）
        B) 「我已有代码，打开文件夹」→ 工作区选择 → 默认 solo-dev 试用
      禁止：首屏 6 张卡片 + 要求理解 workflow 名

  - id: J2_greenfield
    frequency: 高（独立开发者拉新）
    ux_flow: |
      向导 3 步：项目名 + 存放位置 → 一句话描述 → 技术栈(默认 Auto)
      → 自动 mkdir + 绑定 → 启动 greenfield-mvp
      → 看板 7 段可见 → 审批 → 摘要含 npm run dev
      → CTA「加第一个功能」

  - id: J3_daily_feature
    frequency: 最高
    ux_flow: |
      打开已有 workspace → 输入框 placeholder「Describe what to build…」
      → 系统路由 solo-dev → 看板 6 段 → 审批 → diff

  - id: J4_hotfix
    frequency: 高
    ux_flow: |
      粘贴报错 / 说「修 bug」→ 路由 quick-fix
      → 或 Context Panel「当前失败 Run → 一键重试修复」

  - id: J5_team_sync
    frequency: 中（大决策前）
    ux_flow: |
      工厂输入框旁「@团队」→ 轻量面板选角色 or 发起 5min 讨论
      → 结论一键「按此执行」注入输入框 → 启动 Run
      不必：先去团队页 → 切 Tab → 建会话 → 再回工厂

  - id: J6_power_user
    frequency: 低
    ux_flow: |
      工作室模式 → 展开全部产线 / 自定义 workflow / 角色高级配置

