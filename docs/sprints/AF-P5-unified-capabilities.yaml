epics:
  - id: AF-UX-01
    title: 首启 & 新建项目向导
    user_story: 作为新用户，我不需要懂 workflow，30 秒内开始第一个 Run
    estimated_hours: 32
    replaces_partial: [AF-16a]
    deliverables:
      - FirstRunModal：已有代码 vs 从零开始（仅首次或空状态）
      - NewProjectWizard：名称 + 路径 + 一句话 + 栈(Auto) → mkdir + bind + greenfield
      - 空 workspace 时工厂 Hero 变为向导 CTA，隐藏产线卡片墙
      - Golden Path #2 走完整向导
    success_metric: first_run_within_24h >= 60%

  - id: AF-UX-02
    title: 工厂意图优先主界面
    user_story: 我只管打字，系统告诉我它将用什么方式帮我做
    estimated_hours: 40
    depends_on: [AF-12]
    deliverables:
      - 主输入框上方删除 6 卡默认展示；改为「推荐产线」1 条 + 可切换
      - 输入时实时显示：将使用 · solo-dev · 预计 6 阶段 · 约 10–20min
      - 引导模式仅 3 chip：新建 / 改代码 / 试用
      - 工作室模式「更多方式」折叠 drawer
      - selectedWorkflowName 由 suggestWorkflowName + 上下文驱动，非手点卡片
    design_note: |
      现有 FactoryConsoleTab quickCards 保留数据层，改 presentation 层
      FACTORY_QUICK_LINES → FACTORY_INTENT_CHIPS（用户语言）

  - id: AF-UX-03
    title: 无死胡同 — Run 完成态 & 串联
    user_story: Run 结束后我知道该点哪里继续
    estimated_hours: 32
    replaces: [AF-17 核心 UX 部分]
    depends_on: [AF-16, AF-13]
    deliverables:
      - 完成 Banner：摘要 + 主 CTA + 次 CTA（各 1 个，不多）
      - greenfield 完成 → 「加第一个功能」
      - plans 完成 → 「开始执行计划」
      - 讨论 conclusion → 「按结论启动」（AF-UX-04 后）
      - 失败 Run → 「重试此阶段 / 切换 quick-fix」
    success_metric: run_completion >= 70%

  - id: AF-UX-04a
    title: 团队 @ 派活 + 消息显名（Phase 1）
    user_story: 对话里 @ 谁是谁回复；消息带角色名/色
    estimated_hours: 32
    replaces_partial: [AF-18, AF-20 消息层]
    deliverables:
      - ChatInput @ 选择器 + ExecuteTeamTaskRequest.role_ids
      - RoleEditor trigger_keywords 在「高级 ▸」
      - MessageBubble role_name + 角色色
      - 多角色并行进度条
    note: 不合并 Tab；先解决 80% 派活场景

  - id: AF-UX-04b
    title: 团队聊天合并（Phase 2）
    user_story: 派活 | 讨论 单页；讨论一步 Setup
    estimated_hours: 32
    depends_on: [AF-UX-04a]
    replaces_partial: [AF-19, AF-21]
    deliverables:
      - TeamChat SegmentedControl：[派活 | 讨论]
      - DiscussionSetupSheet + 场景预设
      - 辩论/主持 → 讨论模式「高级」折叠
      - 结论 → 「按此启动 Run」
    phase: Beta

  - id: AF-UX-07
    title: 启动前预览 — 信任与成本
    user_story: 我点启动前知道多久、改哪、大概花多少钱
    estimated_hours: 24
    depends_on: [AF-UX-02]
    deliverables:
      - LaunchPreviewBar：时长 · 阶段数 · 可能影响路径 · 预估 CLI 成本
      - 数据：规则估算 + 历史同类 Run 中位数（无历史则静态默认）
      - 高级：换团队 / 限定 target 目录
    success_metric: launch_preview_view_rate >= 90%  # 启动前可见

  - id: AF-UX-08
    title: 审批策略 + 异步厂长
    user_story: 不必一直盯着；少批几次；离开 App 也能收到「待批准」
    estimated_hours: 32
    deliverables:
      - settings approval_policy：trust_gates_final_only | approve_all（首次默认后者）
      - Golden / solo 日常：自动过编译+测试门，仅最终交付批
      - Tauri 系统通知 + Dock/menu badge「N 项待批准」
      - 工厂首页 FactoryTodoStrip（待批准 + 失败可重试）
    success_metric: w2_retention 提升；approval_steps_per_run 下降

  - id: AF-UX-09
    title: 失败可恢复
    user_story: 卡门 / CLI 挂了 / Run failed — 我知道怎么办
    estimated_hours: 32
    deliverables:
      - 质量门失败 → [AI 再修一轮] [打开终端] [跳过此门·高级]
      - CLI 未配置 → 内嵌 3 步（检测→路径→再试），非纯 error 文案
      - Run failed → checkpoint 从失败 stage 重试（非整 Run 重来）
      - 对齐 MASTER-PLAN terminal_fallback <= 20%
    success_metric: failed_run_recovery_rate >= 40%

  - id: AF-UX-10
    title: 本任务时间线
    user_story: 一个任务一条故事线，不在 Tab 间跳
    estimated_hours: 24
    depends_on: [AF-UX-03]
    phase: Beta
    deliverables:
      - Context Panel TaskTimeline：用户输入 / 阶段 / @团队意见 / 审批 / diff
      - 聚合 factory run + team message + approval 事件

  - id: AF-UX-11
    title: Cmd+K 厂长控制台
    user_story: 启动/批准/@/切 workspace 一个入口；主输入框只写任务
    estimated_hours: 24
    phase: Beta
    deliverables:
      - CommandPalette 扩展：批准待办、重放上轮 Run、@角色、切 workspace
      - 与 FactoryConsole 输入框职责分离 documented in ui_specs

  - id: AF-UX-12
    title: Cursor 共生 + 轻量个性化
    user_story: 和 Cursor 一起用，不是换编辑器；越用越省事
    estimated_hours: 24
    phase: Beta
    deliverables:
      - 产物 Tab「在 Cursor 中打开」+ 复制「给 Cursor 的上下文」
      - Run 前可选「自己在 Cursor 改 / 交给工厂」
      - 规则个性化：第 3 次 Run 后跳过向导；记住常用栈；「像上次一样」
    explicit_not: 内置完整编辑器

  - id: AF-UX-05
    title: 上下文智能路由
    user_story: 我粘贴报错它知道是修 bug；空文件夹它知道是新建
    estimated_hours: 24
    deliverables:
      - suggestWorkflowName 增强 + workspace 信号（file count, package.json, git）
      - 粘贴多行 stack trace → auto quick-fix + 提示「已识别为错误修复」
      - 输入含「新 app / 从零」且 workspace 空 → auto greenfield + 触发向导
      - 输入超 200 字 + 「模块/系统」→ 建议 dev-workflow（可一键切换）
    note: 规则路由，非 LLM；可预测、可测试

  - id: AF-UX-06
    title: 工厂内嵌 @团队
    user_story: 我不离开工厂就能问架构师一句
    estimated_hours: 24
    depends_on: [AF-UX-04]
    deliverables:
      - FactoryConsole 输入框 @ 唤起团队角色 mini-picker
      - 单角色 quick ask → 回复插入 Context Panel「团队意见」
      - 多角色 → 跳转 TeamChat 讨论模式（带 prefill topic）

  # ── 保留的工程 Sprint（UX Epic 内调用，顺序后移）──

  - id: AF-12
    title: 动态产线看板（信任基础设施）
    estimated_hours: 24
    deliverables:
      - workflowPipelines.ts 全注册表
      - RunPipelineBoard 随 workflow / 输入预览切换
      - inferCurrentStageName 优先 stage_results

  - id: AF-16
    title: greenfield-mvp 产线 yaml
    estimated_hours: 40
    depends_on: [AF-UX-01, AF-12]
    deliverables:
      - config/workflows/greenfield-mvp.yaml（7 阶段满配）
      - stack presets: react-vite, next, go-api, tauri

  - id: AF-13
    title: quick-fix 满配
    estimated_hours: 32
    depends_on: [AF-12]

  - id: AF-14
    title: dev-workflow 满配（高级入口）
    estimated_hours: 32
    depends_on: [AF-12]
    ux_note: 默认折叠在「更多 → 大功能 · 四人协作」

  - id: AF-15
    title: 内部 Tier 收口
    estimated_hours: 16
    depends_on: [AF-UX-02, AF-13, AF-14, AF-16]

# ═══════════════════════════════════════════════════════════════════════════
# 五、界面规格摘要（给设计 & 开发）
# ═══════════════════════════════════════════════════════════════════════════

ui_specs:
  launch_preview_bar:
    layout: |
      ⏱ 约 10–20 分钟 · 6 阶段 · 可能影响 src/ package.json
      💰 预估 CLI ~$0.3（基于历史）    [ 高级 ▸ ]

  factory_console_guided:
    layout: |
      ┌─────────────────────────────────────────┐
      │  ⚠ 1 项待批准 · 2 项可重试  ← TodoStrip │
      │  今天想做什么？                           │
      │  ┌─────────────────────────────────────┐ │
      │  │ 描述你的想法…                        │ │
      │  └─────────────────────────────────────┘ │
      │  ⏱ ~15min · 6阶段 · src/  💰 ~$0.3      │
      │  [新建项目] [改代码] [试用演示]            │
      │  ▓▓▓░░░ 产线预览                         │
      │                          [启动 ▸]        │
      └─────────────────────────────────────────┘

  factory_console_studio:
    adds: 团队 @ | 附件 | 团队/项目 override | 更多产线 drawer

  team_chat_unified:
    layout: |
      [ 派活 | 讨论 ]     参与者 chips…
      ─────────────────────────────────
      消息流（角色色 + 名）
      ─────────────────────────────────
      @ 角色 …                    [发送]

  run_complete_banner:
    layout: |
      ✅ 交付完成 · 改了 12 个文件
      [ 查看 diff ]  [ 加第一个功能 ▸ ]  [ 关闭 ]

# ═══════════════════════════════════════════════════════════════════════════
# 六、分阶段发布（用户感知，非 Sprint 编号）
# ═══════════════════════════════════════════════════════════════════════════

release_phases:
  - phase: Alpha-UX-1
    name: 能开跑
    ships: [AF-UX-01, AF-UX-02, AF-12, AF-16]
    exit_criteria:
      - 新用户 30s 内启动 Run
      - 首屏 ≤3 intent chip
    user_gets: 向导 + 意图输入框 + 建厂/改代码 + 看板

  - phase: Alpha-UX-2
    name: 敢跑、不盯着、挂了能救
    ships: [AF-UX-03, AF-UX-07, AF-UX-08, AF-UX-09, AF-13, AF-UX-05]
    exit_criteria:
      - 启动前预览可见率 >= 90%
      - Run 完成 next_step_click >= 50%
      - failed_run_recovery 有明确 CTA
    user_gets: 预览 + 少审批 + 通知 + 失败重试 + 修 bug 路由

  - phase: Alpha-UX-3
    name: 团队可选
    ships: [AF-UX-04a, AF-UX-06, AF-14]
    exit_criteria:
      - J1–J4 不依赖团队仍可完成
    user_gets: @ 派活 + 工厂内嵌 @；四人组在「更多」

  - phase: Beta
    name: 叙事与共生
    ships: [AF-UX-04b, AF-UX-10, AF-UX-11, AF-UX-12, AF-15]
    user_gets: 合并聊天、时间线、Cmd+K、Cursor 共生、界面收口

# ═══════════════════════════════════════════════════════════════════════════
# 七、指标（UX 导向）
# ═══════════════════════════════════════════════════════════════════════════

metrics:
  activation:
    - first_run_within_24h >= 60%
    - wizard_completion >= 75%
  trust_v3:
    - launch_preview_view_rate >= 90%
    - run_start_after_preview >= 70%   # 看完预览仍启动
  engagement:
    - intent_box_starts >= 80%
    - next_step_click >= 50%
    - approval_steps_per_run <= 1.5    # 审批减负后
  outcome:
    - time_to_first_value <= 15min
    - golden_path_success >= 80%
    - run_completion >= 70%
    - failed_run_recovery_rate >= 40%
  async_v3:
    - approval_via_notification >= 25% # 通过通知回到 App 批准
  team_optional:
    - factory_only_users_ok
    - discuss_to_run >= 30%

# ═══════════════════════════════════════════════════════════════════════════
# 八、明确不做 & 风险
# ═══════════════════════════════════════════════════════════════════════════

explicit_not_doing:
  - 首屏 6+ 产线卡片墙
  - 要求用户理解 workflow / yaml / tier
  - 对话+讨论双 Tab 长期并存（04b 前保持两 Tab + flag）
  - LLM 黑盒路由
  - 替代 Cursor / 画布 / 模板市场
  - dev-workflow / investigate / review 上首屏
  - brainstorm 串联进工厂主路径（Tier 3）
  - 讨论高级策略（辩论/主持）默认暴露
  - AF-UX-04b 与 04a 同 Sprint 合并交付

deferred_not_cut:
  - dev-workflow → 「更多」+ AF-14
  - investigate/review → Cmd+K 或粘贴报错路由
  - TeamChat 合并 → 04b Beta，04a 先 @

top_ux_risks:
  - id: R-UX-1
    risk: 意图路由猜错 → 用户不信
    mitigation: 显示「将使用 xxx」+ 一键切换；永远可 override
  - id: R-UX-2
    risk: 向导步骤多 → 流失
    mitigation: 3 步封顶；栈默认 Auto；路径可记忆
  - id: R-UX-3
    risk: 合并 TeamChat  regression
    mitigation: 派活/讨论底层 API 不动，只改 UI 壳 + feature flag

resource_priority_v3:
  ship_first: [AF-UX-01, AF-UX-02, AF-12, AF-16]
  ship_second: [AF-UX-03, AF-UX-07, AF-UX-08, AF-UX-09, AF-13, AF-UX-05]
  ship_third: [AF-UX-04a, AF-UX-06, AF-14]
  ship_beta: [AF-UX-04b, AF-UX-10, AF-UX-11, AF-UX-12, AF-15]
  one_liner: 开跑 → 敢跑不盯着能救 → 团队可选 → Beta 叙事共生

# ═══════════════════════════════════════════════════════════════════════════
# 九、防跑偏治理
# ═══════════════════════════════════════════════════════════════════════════

governance:
  implementation: docs/sprints/AF-P5-GOVERNANCE.md  # §B 实现
  plan_iteration: docs/sprints/AF-P5-GOVERNANCE.md  # §A 规划
  decisions_log: docs/sprints/AF-P5-DECISIONS.md
  pr_checklist: docs/sprints/PR-CHECKLIST-AF-P5.md
  journey_e2e: nx_dashboard/e2e/journey-af-p5.spec.ts
  meta_gate: ./scripts/gate-check.sh AF-P5

  wip_limit: 1

  feature_flags:
    p5_first_run_wizard: AF-UX-01
    p5_intent_console: AF-UX-02
    p5_run_next_step: AF-UX-03
    p5_launch_preview: AF-UX-07
    p5_approval_policy: AF-UX-08
    p5_failure_recovery: AF-UX-09
    p5_team_chat_at: AF-UX-04a
    p5_team_chat_unified: AF-UX-04b

  plan_change_protocol:
    - 提案写入 AF-P5-DECISIONS.md「待决提案」
    - @qinyu 批准
    - 改 yaml version + 决策条目
    - 再动实现

  deviation_red_flags:
    - 首屏 6+ 产线卡片
    - 用户必选 workflow 名
    - Run 结束无 CTA
    - v3 后启动无 LaunchPreviewBar
    - 失败仅日志无重试 CTA
    - 未 DECISIONS 批准改 Epic 顺序
    - AI 另起规划不合并 yaml
