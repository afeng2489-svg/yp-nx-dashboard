# Feature Development Workflow — AF-14 满配

name: "dev-workflow"
version: "1.1"
description: "四人协作 — 规划 → 实现 → 审查 ∥ 测试 → 审批 → 摘要"

triggers:
  - type: manual
    inputs:
      feature_name:
        type: string
        required: true
        description: "要开发的功能名称"
      target:
        type: string
        required: true
        description: "目标项目路径或模块名"

variables:
  feature_name: ""
  target: ""

agents:
  - id: planner
    role: 架构师
    model: claude-sonnet-4-6
    prompt: |
      你是软件架构师，负责规划功能 "{{feature_name}}" 的实现方案。
      目标路径：{{target}}
      读取代码库后输出：模块结构、API、数据模型、风险。

  - id: coder
    role: 开发工程师
    model: claude-sonnet-4-6
    depends_on: [planner]
    prompt: |
      功能：{{feature_name}} · 目标：{{target}}
      架构：{{planner_规划_output}}
      按设计实现，遵循现有风格，Bash 验证编译。

  - id: reviewer
    role: 审查员
    model: claude-sonnet-4-6
    depends_on: [coder]
    prompt: |
      审查功能 "{{feature_name}}" 的实现：安全、边界、错误处理。发现问题直接修复。

  - id: tester
    role: 测试工程师
    model: claude-sonnet-4-6
    depends_on: [coder]
    prompt: |
      为 "{{feature_name}}" 编写并运行测试，确保通过。

  - id: summary
    role: 交付摘要员
    model: claude-sonnet-4-5
    executor: api
    prompt: |
      功能：{{feature_name}}
      审查：{{reviewer_审查与测试_output}}
      用中文生成交付摘要，末尾 JSON：
      ```json
      {"summary":"…","files_changed":["…"]}
      ```

stages:
  - name: 规划
    agents: [planner]

  - name: 实现
    agents: [coder]
    quality_gate:
      checks:
        - cmd: "sh -c 'if [ -f Cargo.toml ]; then cargo build 2>&1; elif [ -f package.json ]; then npx tsc --noEmit 2>&1; elif [ -f go.mod ]; then go build ./... 2>&1; fi'"
          timeout: 300
      on_fail: retry
      max_retries: 2

  - name: 审查与测试
    agents: [reviewer, tester]
    parallel: true
    quality_gate:
      checks:
        - cmd: "sh -c 'if [ -f Cargo.toml ]; then cargo test 2>&1; elif [ -f package.json ]; then npm test -- --passWithNoTests 2>&1; fi'"
          timeout: 300
      on_fail: retry
      max_retries: 2

  - name: 交付审批
    stage_type: approval
    question: "四人组已完成实现与审查测试。是否批准交付？"
    output_var: approval_result
    on_reject_goto: 实现

  - name: 交付摘要
    executor: api
    agents: [summary]
