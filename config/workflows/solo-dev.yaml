name: solo-dev
version: "1.1"
description: "一人团队 — 单次 Agent 会话完成规划+实现+自测，质量门卡控，审查走 API 文本车道。"

triggers:
  - type: manual
    inputs:
      task:
        type: string
        required: true
        description: "用一句话描述你要做什么，例如：给用户模块加一个头像上传功能"
      target:
        type: string
        required: false
        description: "目标路径或模块（留空则 Agent 自行判断）"
      lang:
        type: string
        required: false
        description: "项目语言：rust / typescript / python / go（留空则 Agent 自行判断）"

variables:
  task: ""
  target: "."
  lang: "auto"

agents:
  - id: solo
    role: 全栈工程师
    model: claude-sonnet-4-6
    prompt: |
      你是一名独立全栈工程师，在**一次会话**内完成规划、实现与自测。

      任务：{{task}}
      目标路径：{{target}}
      语言/框架：{{lang}}

      按顺序执行（不要跳步）：
      1. **规划**：用 Read/Glob 快速扫目标路径，输出 ≤15 行方案（改哪些文件、接口、边界）
      2. **实现**：按方案 Edit/Write，遵循现有风格，不引入多余依赖
      3. **自测**：Bash 跑构建与测试，失败则当场修复直到通过；无测试则补关键单测

      约束：
      - 优先小 diff，避免无关重构
      - 构建/测试命令按项目类型自选（cargo / npm / go test 等）
      - 不要询问确认，直接执行

  - id: reviewer
    role: 代码审查员
    model: claude-sonnet-4-5
    executor: api
    prompt: |
      根据以下开发产出做简短代码审查（纯文本，不调用工具）。

      任务：{{task}}
      开发阶段输出：
      {{开发_output}}

      检查：安全、边界、错误处理、可读性。用中文列出 3–5 条结论；若发现明确问题，写出建议（不必改文件）。
      末尾 JSON：
      ```json
      {"summary":"…","files_changed":["…"]}
      ```

  - id: summary
    role: 交付摘要员
    model: claude-sonnet-4-5
    executor: api
    prompt: |
      任务：{{task}}
      开发输出：{{开发_output}}
      审查输出：{{审查_output}}

      请用中文生成本次 Run 的交付摘要（纯文本，不调用工具）。
      必须在回复末尾附上 JSON 块：
      ```json
      {"summary":"…","files_changed":["path1","path2"]}
      ```

stages:
  - name: 开发
    agents: [solo]
    quality_gate:
      checks:
        - cmd: "sh -c 'if [ -f Cargo.toml ]; then cargo build 2>&1 && cargo test 2>&1; elif [ -f package.json ]; then (npm run build --if-present 2>&1 || true); npm run test --if-present 2>&1; elif [ -f go.mod ]; then go build ./... 2>&1 && go test ./... 2>&1; elif [ -f pytest.ini ] || [ -f pyproject.toml ]; then python -m pytest 2>&1; else echo ok; fi'"
          timeout: 300
      on_fail: retry
      max_retries: 1

  - name: 交付审批
    stage_type: approval
    question: "开发已完成并通过质量门。是否批准交付？驳回将返回「开发」阶段修改。"
    output_var: approval_result
    on_reject_goto: 开发

  - name: 审查
    executor: api
    agents: [reviewer]

  - name: 交付摘要
    executor: api
    agents: [summary]
